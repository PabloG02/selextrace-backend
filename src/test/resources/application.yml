spring:
  datasource:
    url: jdbc:h2:mem:selextrace-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

selextrace:
  files:
    upload-dir: "./build/test-data/files"
  security:
    frontend-success-url: "http://localhost:4200/auth/callback"
    frontend-failure-url: "http://localhost:4200/login"
    allowed-origins:
      - "http://localhost:4200"
      - "http://127.0.0.1:4200"
