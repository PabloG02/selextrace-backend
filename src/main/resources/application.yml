spring:
  application:
    name: SELEXTrace
  
  config:
    # This file must be created locally.
    # It is excluded from Git via .gitignore.
    import: "optional:file:.secrets.yml"

  datasource:
    # These variables can be defined inside .secrets.yml.
    # Example:
    # POSTGRES_URL: jdbc:postgresql://localhost:5432/selextrace
    # POSTGRES_USER: username
    # POSTGRES_PASSWORD: password
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        order_inserts: true
        jdbc:
          batch_size: 100000

  servlet:
    multipart:
      max-file-size: 10GB
      max-request-size: 10GB

selextrace:
  files:
    upload-dir: "./.data/files-spring"
  security:
    frontend-success-url: ${FRONTEND_SUCCESS_URL}
    frontend-failure-url: ${FRONTEND_FAILURE_URL}
    google-client-id: ${GOOGLE_CLIENT_ID}
    google-client-secret: ${GOOGLE_CLIENT_SECRET}
    allowed-origins:
      - "http://localhost:4200"
      - "http://127.0.0.1:4200"
      - "https://pablog02.github.io"
