spring:
  datasource:
    # Persistent local database file
    url: jdbc:h2:file:./.data/selextrace;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update

selextrace:
  security:
    frontend-success-url: http://localhost:4200/auth/callback
    frontend-failure-url: http://localhost:4200/login
    allowed-origins:
      - "http://localhost:4200"
      - "http://127.0.0.1:4200"
